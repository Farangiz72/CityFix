server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Фото заявок до MAX_UPLOAD_MB + запас
    client_max_body_size 20m;

    # API и загруженные фото проксируются в сервис api (docker compose).
    # ^~ — чтобы regex-локация статики ниже не перехватывала /uploads/*.jpg
    location ^~ /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        expires 7d;
    }

    # SPA: любой путь отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
