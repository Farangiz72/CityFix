# CityFix / СитиФикс — единый запуск системы (one-command start)
# docker compose up --build  ->  http://localhost:8080
#
# База данных — файл SQLite внутри контейнера API (volume db_data -> /app/data).
# Отдельный сервер БД не нужен: система поднимается одной командой на любой машине.
# The database is a SQLite file inside the API container; no separate DB server is required.

services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      # Файл БД в именованном volume / SQLite file stored in a named volume
      DATABASE_URL: file:/app/data/cityfix.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required: copy .env.example to .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      UPLOAD_DIR: /app/uploads
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_DEMO_REQUESTS: ${SEED_DEMO_REQUESTS:-1000}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - db_data:/app/data
      # Фото заявок: docker volume, не попадает в git (.gitignore)
      - uploads:/app/uploads
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  db_data:
  uploads:
